name: Copy FORMA HOME storefront
on:
  push:
    paths:
      - '.github/workflows/import-storefront.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --single-branch --branch main https://github.com/gkkm8bm7rn-eng/tetopt.git source-store
          git clone "https://x-access-token:${GH_TOKEN}@github.com/gkkm8bm7rn-eng/forma-designer-private.git" destination
      - name: Import full storefront without source CI workflows
        run: |
          rsync -a --exclude='.git/' --exclude='.github/workflows/' source-store/ destination/
          cd destination
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete FORMA HOME storefront and product assets"
      - name: Upload storefront to designer repository
        run: |
          cd destination
          git push origin main
