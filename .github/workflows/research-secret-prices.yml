name: Research Secret de Maison catalog
on:
  push:
    branches: [research-secret-de-maison-20261008]
    paths: ['.github/workflows/research-secret-prices.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect public catalog
        shell: bash
        run: |
          cat > /tmp/research_sdm.py <<'PY'
          import requests,bs4,re,time
          from urllib.parse import urljoin
          base="https://secretdemaison.ru"
          s=requests.Session();s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; ResearchCollector/1.0; public catalog prices)"})
          for uri in ["/robots.txt","/catalog/mebel/","/catalog/dekor/","/catalog/svet/"]:
           try:
            r=s.get(base+uri,timeout=25)
            print("CHECK",uri,r.status_code,len(r.content),"final",r.url)
            if uri=="/robots.txt":print("ROBOTS",r.text[:5000]);continue
            soup=bs4.BeautifulSoup(r.text,"html.parser")
            t=soup.find(string=re.compile("Артикул\s*\d+"))
            print("FIRST ARTICLE",str(t)[:170] if t else "")
            if t:
             parent=t.parent
             for i in range(6):
              if not parent:break
              print("ANCESTOR",i,parent.name,parent.get("class"),parent.get("id"),"len",len(parent.get_text(' ',strip=True)),"text",parent.get_text(' ',strip=True)[:600])
              if i in (3,4):print("HTML",str(parent)[:2300])
              parent=parent.parent
            print("PAGINATION",[(x.get_text(' ',strip=True),x.get("href")) for x in soup.select("a[href*='curPos']")][:12])
           except Exception as e:print("ERROR",uri,type(e).__name__,str(e)[:250])
           time.sleep(1)
          PY
          python /tmp/research_sdm.py
