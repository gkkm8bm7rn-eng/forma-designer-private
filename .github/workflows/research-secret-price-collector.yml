name: Secret de Maison public catalog research
on:
  push:
    branches: [research-secret-prices-20261008]
    paths:
      - .github/workflows/research-secret-price-collector.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install parser
        run: pip install --quiet beautifulsoup4 requests
      - name: Check official site accessibility
        shell: bash
        run: |
          python - <<'PY'
          import requests,bs4,re
          for uri in ['/robots.txt','/catalog/','/catalog/?curPos=18','/sitemap.xml']:
            url='https://secretdemaison.ru'+uri
            try:
              r=requests.get(url,timeout=25,headers={'User-Agent':'Mozilla/5.0 (compatible; CatalogPriceResearch/1.0)'})
              print('FETCH',uri,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              soup=bs4.BeautifulSoup(r.content,'html.parser')
              if uri.startswith('/catalog'):
                for match in soup.find_all(string=re.compile('Артикул',re.I),limit=4):
                  print('ARTICLE_CONTEXT',repr(str(match)[:120]),repr(str(match.parent.parent)[:2200]))
                for link in soup.select('a[href]')[:8]:print('LINK',link.get('href'),link.get_text(' ',strip=True)[:65])
                print('BODY_SAMPLE',soup.get_text(' ',strip=True)[500:1300])
                cards=soup.select('.catalog-item')
                print('CARDS',len(cards))
                for card in cards[:2]: print('FULL_CARD',card.prettify()[:7500])
                for text in soup.find_all(string=re.compile(r'\\d+\\s+товар',re.I),limit=3):print('TOTAL_TEXT',repr(text.strip()))
                links=[x.get('href','') for x in soup.select('a[href]') if 'curPos=' in x.get('href','')]
                print('PAGES_LINKS',links[-15:])
              else:print('FILE_SAMPLE',r.text[:1200])
            except Exception as e:print('FETCH_ERROR',uri,type(e).__name__,str(e)[:300])
          PY
