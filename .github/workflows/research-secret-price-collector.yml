name: Secret de Maison public catalog research
on:
  push:
    branches: [research-secret-prices-20261008]
    paths: ['.github/workflows/research-secret-price-collector.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: pip install --quiet beautifulsoup4 requests
      - name: Collect official public prices
        shell: bash
        run: |
          cat > /tmp/collect_secret_prices.py <<'PY'
          import requests,bs4,re,json,time,random,concurrent.futures,collections,datetime,urllib.parse,urllib.robotparser,pathlib,threading
          BASE="https://secretdemaison.ru"; ROOT=BASE+"/catalog/?curPos="; DEST=pathlib.Path("research/secret_de_maison_official_prices_2026-10-08_v2.json")
          UA="Mozilla/5.0 (compatible; PublicPriceComparisonResearch/1.0)"
          price_re=re.compile(r"(\d[\d \u00a0\u202f]*)\s*руб",re.I)
          T=threading.local()
          def session():
           if not hasattr(T,"s"):
            T.s=requests.Session();T.s.headers.update({"User-Agent":UA})
           return T.s
          def number(v):
           return int(re.sub(r"\D","",v)) if v and re.search(r"\d",v) else None
          def fetch(url):
           for attempt in range(4):
            if attempt:time.sleep(1.5**attempt+random.uniform(.3,1))
            try:
             r=session().get(url,timeout=30)
             if r.status_code in [429,500,502,503,504]:continue
             if r.status_code!=200 or len(r.content)<5000:raise ValueError(f"HTTP {r.status_code}, bytes {len(r.content)}")
             return r
            except requests.RequestException:continue
           raise RuntimeError("Failed to fetch "+url)
          def page(offset,root=ROOT):
           time.sleep(random.uniform(.35,.85))
           u=root+str(offset);r=fetch(u);s=bs4.BeautifulSoup(r.content,"html.parser")
           cards=s.select(".catalog-item")
           if not cards:raise RuntimeError("No product cards at "+str(offset))
           txt=s.get_text(" ",strip=True)
           totals=[int(x) for x in re.findall(r"\b(\d{3,5})\s+товар(?:ов|а)?",txt,re.I)]
           declared=next((n for n in totals if 0<n<6000),None)
           items=[]
           for el in cards:
            link=el.select_one(".catalog-item__title")
            if not link:continue
            art=el.select_one(".catalog-item__art")
            art_match=re.search(r"Артикул\s*([\w-]+)",art.get_text(" ",strip=True),re.I) if art else None
            cost=el.select_one(".catalog-item__cost");raw=cost.get_text(" ",strip=True) if cost else ""
            nums=[number(p) for p in price_re.findall(raw)]
            old_node=cost.find("span") if cost else None
            old_text=old_node.get_text(" ",strip=True) if old_node else None
            old=number(old_text) if old_text and price_re.search(old_text) else None
            current=nums[-1] if nums else None
            if len(nums)>2 or len(nums)==2 and old is None:raise RuntimeError("Ambiguous price: "+raw)
            if old is not None and current is not None and old<current:raise RuntimeError("Price order reversed: "+raw)
            specs={}
            for li in el.select(".catalog-item__info li"):
             label=li.select_one("span")
             if label:
              key=label.get_text(" ",strip=True).strip(": ");val=li.get_text(" ",strip=True)[len(label.get_text(" ",strip=True)):].strip()
              if key and val:specs[key]=val
            img=el.select_one(".catalog-item__image img")
            items.append(dict(
             article=art_match.group(1) if art_match else None,
             source_id=el.get("data-id"),
             name=link.get_text(" ",strip=True),
             url=urllib.parse.urljoin(BASE,link.get("href") or ""),
             current_price_rub=current,
             old_price_rub=old,
             discount_rub=old-current if old and current else None,
             discount_percent=round((old-current)/old*100,2) if old and current else None,
             sale_badge="sale" in el.get("class",[]),
             price_published=current is not None,
             raw_price=raw or None,
             attributes=specs or None,
             photo_url=urllib.parse.urljoin(BASE,img.get("data-src") or img.get("src")) if img else None,
             listing_offset=offset,
             listing_url=u
            ))
           return dict(offset=offset,count=len(items),declared=declared,items=items,real_url=r.url)
          robot=session().get(BASE+"/robots.txt",timeout=30)
          rp=urllib.robotparser.RobotFileParser();rp.parse(robot.text.splitlines())
          if not rp.can_fetch(UA,ROOT+"0") or not rp.can_fetch(UA,ROOT+"18"):
           raise RuntimeError("Page disallowed by robots.txt")
          p0=page(0)
          print("START",json.dumps({k:p0[k] for k in ["offset","count","declared","real_url"]},ensure_ascii=False),flush=True)
          if p0["declared"] is None:
           raise RuntimeError("Unable to detect live product total: refusing to claim complete catalog")
          total=p0["declared"]
          offsets=list(range(18,total,18))
          results=[p0];errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
           jobs={pool.submit(page,n):n for n in offsets}
           for job in concurrent.futures.as_completed(jobs):
            off=jobs[job]
            try:
             results.append(job.result())
             if len(results)%12==0:print("PROGRESS",len(results),len(offsets)+1,"items",sum(v["count"] for v in results),flush=True)
            except Exception as e:
             errors.append({"offset":off,"error":str(e)});print("PAGE_ERROR",off,str(e),flush=True)
          results.sort(key=lambda p:p["offset"])
          flat=[v for p in results for v in p["items"]]
          products={};duplicate_urls=[]
          for v in flat:
           key=v["url"]
           if key in products:duplicate_urls.append({"url":key,"offset":v["listing_offset"]})
           else:products[key]=v
          main_unique=list(products.values())
          supplement=[];supplement_errors=[]
          # Cross-check the complete all-products listing against its seven public
          # top-level categories. This resolves pagination duplicates without
          # manufacturing products or prices.
          categories=["mebel","dekor","svet","kovanaya-mebel","ofisnye-kresla","mebel-rotang","assortiment"]
          for category in categories:
           root=BASE+"/catalog/"+category+"/?curPos="
           try:
            first=page(0,root)
            count=first["declared"]
            if not count:raise RuntimeError("Category product count unavailable")
            pages=[first]
            positions=list(range(18,count,18))
            with concurrent.futures.ThreadPoolExecutor(max_workers=3) as cp:
             tasks={cp.submit(page,n,root):n for n in positions}
             for job in concurrent.futures.as_completed(tasks):
              try:pages.append(job.result())
              except Exception as e:supplement_errors.append({"category":category,"offset":tasks[job],"error":str(e)})
            supplement.extend(pages)
            print("CATEGORY",category,"declared",count,"pages",len(pages),"rows",sum(v["count"] for v in pages),flush=True)
           except Exception as e:
            supplement_errors.append({"category":category,"offset":0,"error":str(e)})
            print("CATEGORY_ERROR",category,str(e),flush=True)
          recovered=[]
          for p in supplement:
           for v in p["items"]:
            if v["url"] not in products:
             products[v["url"]]=v
             recovered.append(v["url"])
          unique=list(products.values())
          print("RECOVERED",len(recovered),"FINAL_UNIQUE",len(unique),"DECLARED",total,flush=True)

          article_counts=collections.Counter(v["article"] for v in unique if v["article"])
          stats={
           "declared_products":total,"pages_expected":len(offsets)+1,"pages_read":len(results),
           "rows_read":len(flat),"unique_products":len(unique),
           "unique_articles":len(article_counts),"duplicate_urls":len(duplicate_urls),
           "duplicate_article_count":sum(n-1 for n in article_counts.values() if n>1),
           "missing_article_count":sum(v["article"] is None for v in unique),
           "priced_products":sum(v["current_price_rub"] is not None for v in unique),
           "price_unavailable":sum(v["current_price_rub"] is None for v in unique),
           "visible_old_price":sum(v["old_price_rub"] is not None for v in unique),
           "sale_badge_without_old_price":sum(v["sale_badge"] and v["old_price_rub"] is None for v in unique),
           "page_errors":len(errors),"coverage_deviation":len(unique)-total,
           "supplement_pages":len(supplement),"supplement_errors":len(supplement_errors),"recovered_unique_products":len(unique)-len(main_unique),
           "count_changed_during_scan":len(set(v["declared"] for v in results if v["declared"]))>1
          }
          status="verified_coverage" if not errors and len(unique)>=total else ("full_listing_with_duplicate_urls" if not errors and len(flat)==total else "partial_unverified")
          result=dict(
           schema="secret_de_maison_public_price_snapshot_v2",
           source="https://secretdemaison.ru/catalog/?curPos=0",
           collected_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),
           currency="RUB",status=status,statistics=stats,
           pricing_method="Use final visible price in listing; old price only if separately displayed; badges without old price do not imply a discount; missing amounts are null.",
           errors=errors+supplement_errors,page_checks=[{k:p[k] for k in ["offset","count","declared"]} for p in results],
           duplicates=duplicate_urls[:200],products=unique)
          DEST.parent.mkdir(parents=True,exist_ok=True)
          DEST.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("RESULT",json.dumps({"status":status,"statistics":stats,"output":str(DEST)},ensure_ascii=False),flush=True)
          
          PY
          python /tmp/collect_secret_prices.py
      - name: Save independent research snapshot
        if: always()
        shell: bash
        run: |
          if [ -f research/secret_de_maison_official_prices_2026-10-08_v2.json ]; then
            git config user.name "Research export bot"
            git config user.email "actions@users.noreply.github.com"
            git add research/secret_de_maison_official_prices_2026-10-08_v2.json
            git diff --cached --quiet || (git commit -m "Snapshot public Secret de Maison prices" && git push origin HEAD:research-secret-prices-20261008)
          fi
      - name: Downloadable JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-de-maison-official-prices-2026-10-08-v2
          path: research/secret_de_maison_official_prices_2026-10-08_v2.json
          if-no-files-found: warn
