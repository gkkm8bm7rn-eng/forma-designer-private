name: Apply Tetchair media
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (github.event.issue.title == '[media-apply] Tetchair computer chairs' ||
       github.event.issue.title == '[media-fix] Amura Moncler')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Enrich verified batch range
        if: github.event.issue.title == '[media-apply] Tetchair computer chairs'
        env:
          REQUEST: ${{ github.event.issue.body }}
        run: |
          read START END <<< "$REQUEST"
          if ! [[ "$START" =~ ^[0-9]+$ ]]; then echo 'Invalid batch start'; exit 1; fi
          if [ -z "$END" ]; then END="$START"; fi
          if ! [[ "$END" =~ ^[0-9]+$ ]]; then echo 'Invalid batch end'; exit 1; fi
          if [ "$END" -lt "$START" ]; then echo 'Invalid batch range'; exit 1; fi
          echo "$START $END" > /tmp/media-range
          for i in $(seq "$START" "$END"); do
            echo "Applying media batch $i"
            python scripts/enrich-computer-chair-media.py --apply --batch-index "$i" --batch-size 12 || true
          done
      - name: Import exact October product media\n        if: github.event.issue.title == '[media-apply] October products'\n        run: python scripts/import-october-media.py\n      - name: Repair Amura and Moncler
        if: github.event.issue.title == '[media-fix] Amura Moncler'
        run: python scripts/fix-amura-moncler-media.py
      - name: Commit media changes
        run: |
          git config user.name 'FORMA HOME media bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/products data/details data/catalog-index.json data/computer-chair-photo-audit.json data/october-photo-import-report.json
          if git diff --cached --quiet; then echo 'No media changes'; exit 0; fi
          if [ "${{ github.event.issue.title }}" = "[media-fix] Amura Moncler" ]; then
            MSG='Fix Amura and Moncler product media'
          else
            read START END < /tmp/media-range
            MSG="Enrich computer chair photos batches ${START}-${END}"
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main
