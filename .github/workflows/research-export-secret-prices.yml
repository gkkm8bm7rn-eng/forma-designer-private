name: Export Secret de Maison JSON snapshot
on:
  push:
    branches: [research-secret-de-maison-20261008]
    paths: ['.github/workflows/research-export-secret-prices.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source JSON
        run: |
          python - <<'PY'
          import json
          name="research/secret_de_maison_prices_2026-10-08.json"
          with open(name,encoding="utf-8") as fh: data=json.load(fh)
          rows=data["products"]
          assert len(rows)==2485
          assert sum(p["current_price_rub"] is not None for p in rows)==1053
          assert sum(p["has_discount"] for p in rows)==489
          print("VALID_JSON count",len(rows),"priced",1053,"discounted",489)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: secret-de-maison-prices-2026-10-08-json
          path: research/secret_de_maison_prices_2026-10-08.json
          retention-days: 7
