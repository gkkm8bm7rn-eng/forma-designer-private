name: Diagnose published monochrome styles
on:
  push:
    paths:
      - '.github/workflows/diagnose-monochrome.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect live stylesheet and browser computed colors
        shell: bash
        run: |
          set -e
          echo '--- LIVE ASSETS ---'
          BASE="https://gkkm8bm7rn-eng.github.io/forma-designer-private"
          curl -fsSL --retry 3 "$BASE/architectural-minimal.css?ci=${GITHUB_RUN_ID}" -o /tmp/theme.css
          curl -fsSL --retry 3 "$BASE/index.html?ci=${GITHUB_RUN_ID}" -o /tmp/index.html
          grep -q 'Monochrome finish: category icons' /tmp/theme.css && echo 'THEME: recent monochrome rules PRESENT' || echo 'THEME: MISSING recent rules'
          grep -q 'Favorites keep their original red' /tmp/theme.css && echo 'FAVORITES: red rules PRESENT' || echo 'FAVORITES: red rules MISSING'
          grep -q 'architectural-minimal.css' /tmp/index.html && echo 'HTML: theme link PRESENT' || echo 'HTML: theme link MISSING'
          echo '--- COMPUTED STYLES ---'
          mkdir -p /tmp/style-check
          cd /tmp/style-check
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install chromium >/dev/null
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://gkkm8bm7rn-eng.github.io/forma-designer-private/?ci='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('.product-card',{timeout:40000});
            await page.waitForTimeout(1000);
            const result=await page.evaluate(()=>{
              const selectors={
                badge:'.product-card .product-category-link',
                heart:'.product-card button[data-favorite]',
                categoryIcon:'.mobile-category-icon',
                categoryChevron:'.mobile-category-chevron',
                filter:'.filter-toggle',
                searchIcon:'.search-field::before',
                pagination:'.pagination .page-button.page-arrow',
                newest:'.product-new-badge',
                recentlyViewed:'.recent-add'
              };
              const out={title:document.title,products:document.querySelectorAll('.product-card').length,cssLoaded:[...document.styleSheets].some(s=>s.href?.includes('architectural-minimal.css'))};
              for(const [k,sel] of Object.entries(selectors)){
                const [selector,pseudo]=sel.split('::'),el=document.querySelector(selector);
                if(!el){out[k]='NOT_PRESENT';continue}
                const st=getComputedStyle(el,pseudo?'::'+pseudo:null);
                out[k]={color:st.color,background:st.backgroundColor,border:st.borderColor};
              }
              return out;
            });
            console.log('BROWSER_COLORS='+JSON.stringify(result));
            console.log('BROWSER_ERRORS='+JSON.stringify(errors.slice(0,5)));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
