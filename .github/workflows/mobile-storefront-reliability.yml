name: Mobile storefront reliability
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  iphone-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static safeguards and JavaScript syntax
        run: |
          node --check app.js
          node --check variants.js
          node --check media-policy.js
          node --check cart-feedback.js
          node --check sw.js
          node scripts/check-mobile-reliability.mjs
      - name: Prepare iPhone Safari-compatible browser
        run: |
          npm install --no-save --no-package-lock playwright pngjs
          npx playwright install --with-deps webkit
      - name: iPhone WebKit first and repeat visits
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/forma-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-iphone-webkit.mjs
          node scripts/check-ios-scroll-gap.mjs
