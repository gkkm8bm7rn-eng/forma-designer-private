name: Bulk enrich Tetchair computer-chair media
on:
  push:
    paths:
      - 'data/media-batch-request.txt'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Apply requested batches sequentially
        run: |
          read START END < data/media-batch-request.txt
          for i in $(seq "$START" "$END"); do
            echo "Applying media batch $i"
            python scripts/enrich-computer-chair-media.py --apply --batch-index "$i" --batch-size 12 || true
          done
      - name: Commit enriched galleries
        run: |
          git config user.name 'FORMA HOME media bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/products data/details data/computer-chair-photo-audit.json
          if git diff --cached --quiet; then echo 'No media changes'; exit 0; fi
          git commit -m 'Enrich computer chair photos batches 1-19'
          git pull --rebase origin main
          git push origin HEAD:main
