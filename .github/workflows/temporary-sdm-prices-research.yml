name: Temporary Secret de Maison prices research
on:
  push:
    paths:
      - '.github/workflows/temporary-sdm-prices-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install scraper tools
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect official shop product markup
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          for pos in [0,18]:
            url=f'https://secretdemaison.ru/catalog/?curPos={pos}'
            r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PriceResearch/1.0)'},timeout=25)
            print('FETCH',pos,r.status_code,len(r.content),r.url)
            r.raise_for_status()
            s=BeautifulSoup(r.text,'lxml')
            print('PAGETITLE',s.title.get_text(' ',strip=True)[:130])
            print('COUNT',s.find(string=re.compile('товаров')) and str(s.find(string=re.compile('товаров')))[:90])
            links=s.select('a[href*="/products/"]')
            print('PRODUCT_LINKS',len(links))
            for a in links[:6]:
              print('LINK',a.get('href'),a.get_text(' ',strip=True)[:100],a.parent.get('class'))
            if not links: continue
            first=links[1] if len(links)>1 else links[0]
            for level in range(1,6):
              node=first
              for x in range(level):node=node.parent
              text=node.get_text(' ',strip=True)
              print('PARENT',level,'name',node.name,'class',node.get('class'),'len',len(text),'text',text[:460])
              if len(text)<9000:print('HTML',level,str(node)[:2300])
          r=requests.get('https://secretdemaison.ru/robots.txt',timeout=20)
          print('ROBOTS',r.status_code,'sitemap',re.findall(r'Sitemap:\\s*(\\S+)',r.text,re.I)[:4])
          PY
